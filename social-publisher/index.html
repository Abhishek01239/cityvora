<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Social Publisher</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;background:#09090b;color:#fafafa}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#18181b,#09090b 45%)}
main{max-width:1100px;margin:auto;padding:40px 20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}
h1{font-size:32px;margin:0 0 6px}.muted{color:#a1a1aa}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{background:#111113;border:1px solid #27272a;border-radius:16px;padding:20px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:#fafafa;color:#111}
button.secondary{background:#27272a;color:#fff}.status{font-size:12px;padding:5px 8px;border-radius:999px;background:#27272a;color:#d4d4d8}
textarea,input{width:100%;background:#09090b;color:#fff;border:1px solid #27272a;border-radius:10px;padding:12px;margin-top:8px}
.section{margin-top:28px}.platform{font-size:18px;font-weight:700}.logo{font-size:28px}
#result{white-space:pre-wrap;margin-top:12px;color:#a1a1aa}
</style></head>
<body><main>
<div class="top"><div><h1>Social Publisher</h1><div class="muted">Connect accounts once. Publish from your dashboard or ChatGPT.</div></div></div>
<section><h2>Connected accounts</h2><div id="accounts" class="grid"></div></section>
<section class="section"><h2>Publish now</h2><div class="card">
<label>Post text<textarea id="text" rows="5" placeholder="Write your post..."></textarea></label>
<label>Article URL<input id="url" placeholder="https://..."></label>
<label>Platforms<input id="platforms" placeholder="linkedin, instagram, facebook"></label>
<div style="margin-top:14px"><button onclick="publish()">Publish now</button></div>
<div id="result"></div></div></section>
<script>
const platforms=[
 {id:"instagram",name:"Instagram",icon:"◎"},
 {id:"facebook",name:"Facebook",icon:"f"},
 {id:"linkedin",name:"LinkedIn",icon:"in"},
 {id:"x",name:"X",icon:"𝕏"},
 {id:"youtube",name:"YouTube",icon:"▶"},
 {id:"threads",name:"Threads",icon:"@"},
 {id:"bluesky",name:"Bluesky",icon:"🦋"}
];
function render(){document.getElementById("accounts").innerHTML=platforms.map(p=>`<div class="card"><div class="row"><div><div class="logo">${p.icon}</div><div class="platform">${p.name}</div></div><span class="status">Not connected</span></div><div style="margin-top:18px"><button class="secondary" onclick="connect('${p.id}')">Connect</button></div></div>`).join("")}
function connect(p){location.href="/api/oauth/"+p+"/start"}
async function publish(){const result=document.getElementById("result");result.textContent="Publishing...";
const platforms=document.getElementById("platforms").value.split(",").map(x=>x.trim()).filter(Boolean);
const r=await fetch("/api/publish",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({text:document.getElementById("text").value,url:document.getElementById("url").value,platforms})});
result.textContent=await r.text()}
render();
</script></main></body></html>
